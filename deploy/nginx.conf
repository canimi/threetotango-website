# Three To Tango - nginx (copied to /etc/nginx/conf.d/default.conf)
# Security headers live in /etc/nginx/snippets/ttw-security.conf (deploy/security-headers.conf).

# Cloudflare sends the visitor IP in CF-Connecting-IP; fall back to the socket address.
map $http_cf_connecting_ip $ttw_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    # Live site = symlink in the shared volume, switched atomically by ttw-builder (see deploy/site-builder.mjs).
    root /srv/site/current;
    index index.html;

    # Behind the Cloudflare tunnel nginx only sees http: keep redirect Location headers relative,
    # so a redirect never sends visitors (or Google) through http://.
    absolute_redirect off;

    # Docker DNS + variable => nginx -t passes off-network and starts even if n8n is down.
    resolver 127.0.0.11 valid=30s;
    set $n8n http://n8n-docker-n8n-1:5678;

    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml image/svg+xml;

    include /etc/nginx/snippets/ttw-security.conf;

    error_page 404 /404.html;

    # ---- API proxy to n8n webhooks (only these paths are exposed) ----
    # Shared proxy settings are repeated per location (proxy_* inherit only if a location sets none of them).
    location = /api/subscribe {
        proxy_pass $n8n/webhook/ttw-subscribe;
        include /etc/nginx/conf.d/ttw-proxy.inc;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
    location = /api/verify {
        proxy_pass $n8n/webhook/ttw-verify;
        include /etc/nginx/conf.d/ttw-proxy.inc;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
    location = /api/waitlist {
        proxy_pass $n8n/webhook/ttw-waitlist;
        include /etc/nginx/conf.d/ttw-proxy.inc;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
    location = /api/tango/start {
        proxy_pass $n8n/webhook/ttw-tango-start;
        include /etc/nginx/conf.d/ttw-proxy.inc;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location ~ "^/api/tango/status/([A-Za-z0-9_-]{1,64})$" {
        proxy_pass $n8n/webhook/ttw-tango-status?id=$1;
        include /etc/nginx/conf.d/ttw-proxy.inc;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
    location ~ "^/tango-me/r/([A-Za-z0-9_-]{1,64})$" {
        proxy_pass $n8n/webhook/ttw-tango-share?id=$1;
        # n8n adds "Content-Security-Policy: sandbox" to webhook responses; our own CSP applies instead.
        proxy_hide_header Content-Security-Policy;
        include /etc/nginx/conf.d/ttw-proxy.inc;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
    location = /api/gallery {
        proxy_pass $n8n/webhook/ttw-gallery$is_args$args;
        include /etc/nginx/conf.d/ttw-proxy.inc;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        # Gallery list is public and changes slowly: short shared cache.
        add_header Cache-Control "public, max-age=30";
        include /etc/nginx/snippets/ttw-security.conf;
    }
    location = /api/gallery/like {
        proxy_pass $n8n/webhook/ttw-gallery-like;
        include /etc/nginx/conf.d/ttw-proxy.inc;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        client_max_body_size 2k;
    }
    location = /api/gallery/optin {
        proxy_pass $n8n/webhook/ttw-gallery-optin;
        include /etc/nginx/conf.d/ttw-proxy.inc;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        client_max_body_size 2k;
    }
    # Moderation page: GET renders the HTML, POST takes the form (urlencoded).
    location = /gallery/mod {
        proxy_pass $n8n/webhook/ttw-gallery-mod$is_args$args;
        # n8n adds "Content-Security-Policy: sandbox" to webhook responses; our own CSP applies instead.
        proxy_hide_header Content-Security-Policy;
        # n8n sends its own Referrer-Policy; the security snippet sets the intended one.
        proxy_hide_header Referrer-Policy;
        include /etc/nginx/conf.d/ttw-proxy.inc;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        client_max_body_size 2k;
    }
    # Anything else under /api/ (or a bad id) is not exposed.
    location /api/ {
        return 404;
    }
    location /tango-me/r/ {
        return 404;
    }

    # ---- Media mount (generated/curated media; raw user uploads never public) ----
    location ^~ /media/uploads/ {
        return 404;
    }
    location /media/ {
        alias /usr/share/nginx/media/;
        autoindex off;
        expires 1d;
        include /etc/nginx/snippets/ttw-security.conf;
    }

    # ---- Static assets ----
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/ttw-security.conf;
        try_files $uri =404;
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/ttw-security.conf;
        try_files $uri =404;
    }

    # ---- HTML pages (Astro directory format) ----
    # Canonical URLs have no trailing slash (/episodes, /cats/luka): serve them directly
    # (no directory redirect) and 301 the slash variant to the canonical one.
    location / {
        rewrite ^(/.+)/$ $1 permanent;
        expires 5m;
        include /etc/nginx/snippets/ttw-security.conf;
        try_files $uri $uri/index.html =404;
    }
}
