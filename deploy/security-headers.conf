# Included in every location that sets its own add_header (nginx does not inherit add_header then).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com; script-src 'self' https://stats.canimi.app; connect-src 'self' https://stats.canimi.app; style-src 'self' 'unsafe-inline'; font-src 'self'" always;
